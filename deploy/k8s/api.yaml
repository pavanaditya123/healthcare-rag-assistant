apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: rag-api}
  template:
    metadata:
      labels: {app: rag-api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: api
          image: ghcr.io/pavanaditya123/healthcare-rag-assistant:latest
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: rag-config}
            - secretRef: {name: groq}
          resources:
            requests: {cpu: 500m, memory: 1Gi}   # HPA scales on % of this request
            limits: {cpu: "1", memory: 2Gi}
          readinessProbe:                        # no traffic until models + index are ready
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rag-api
spec:
  selector: {app: rag-api}
  ports: [{port: 80, targetPort: 8000}]
