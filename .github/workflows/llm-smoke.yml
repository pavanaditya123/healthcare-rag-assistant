name: LLM smoke test

# Manual only: one tiny request per model to check keys and model names.
on:
  workflow_dispatch:
    inputs:
      judges:
        description: "Two judge models, comma separated ('gemini:<model>' uses GEMINI_API_KEY)"
        default: "qwen/qwen3.8-27b,gemini:gemini-3.5-flash-lite"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python scripts/llm_smoke.py
        env:
          JUDGES: ${{ inputs.judges }}
