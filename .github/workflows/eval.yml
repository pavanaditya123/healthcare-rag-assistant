name: Retrieval eval

# Real models (bge-small, BM25, MiniLM cross-encoder) on the full corpus.
on:
  push:
    branches: [main]
    paths: ["app/**", "evals/**", "requirements.txt", ".github/workflows/eval.yml"]
  workflow_dispatch:

env:
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 150  # ~1.7 s per rerank on a 2-vCPU runner x ~2,300 searches
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ${{ env.FASTEMBED_CACHE_PATH }}
          key: fastembed-${{ hashFiles('app/config.py') }}
      - run: bash scripts/download_data.sh
      - name: Retrieval + safety end-to-end (+ real Groq answers if the secret is set)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m evals.retrieval_eval --sample 1000 --min-medquad-recall 0.90
      - name: Answer quality, LLM-as-judge (two judges, RAGAS-style metrics)
        if: env.GROQ_API_KEY != ''   # skipped until the repo secret is set
        run: python -m evals.judge_eval --medquad 30 --liveqa 20
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
