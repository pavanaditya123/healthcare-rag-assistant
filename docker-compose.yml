# docker compose up -d --build
# docker compose run --rm ingest        # one-off: build the index (needs ./data, see README)
services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]

  api:
    build: .
    ports: ["8000:8000"]
    environment:
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
    depends_on: [qdrant, redis]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s

  ingest:
    build: .
    command: ["python", "-m", "app.ingest", "--medquad", "/data/MedQuAD"]
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes: [./data:/data:ro]
    depends_on: [qdrant]
    profiles: [tools]   # only runs when asked for

  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes: [./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    depends_on: [api]

volumes:
  qdrant_data:
